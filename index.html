let activeMode = 'block'; 
let currentLevel = 1;
let currentExercise = null;
let points = 0;
let stars = 0;
let solvedBlocks = new Set();
let solvedWrites = new Set();
let hintIndex = 0;
let timerInterval, seconds = 0;

function registrarEstudiante() {
  const input = document.getElementById('studentNameInput');
  const name = input.value.trim();
  if (!name) {
    alert("Por favor ingresa tu nombre completo para comenzar.");
    return;
  }
  studentName = name;
  document.getElementById('registroModal').style.display = 'none';
  
  // Enviar evento de inicio a Google Sheets
  enviarDatosAGoogleSheets("Inicio de Sesión", "El estudiante inició el laboratorio");
  
  loadLevel(1, document.querySelectorAll('.level-btn')[0]);
}

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

function switchMode(mode) {
  if (mode === 'write' && solvedBlocks.size < 4) {
    showOverlay('🔒 Modo Bloqueado', 'Debes completar los 4 niveles en la Fase de Bloques antes de acceder al Modo Escritura.', '⚠️');
    return;
  }
  activeMode = mode;
  document.getElementById('btnModeBlock').className = `mode-btn ${mode === 'block' ? 'active' : ''}`;
  document.getElementById('btnModeWrite').className = `mode-btn ${solvedBlocks.size < 4 ? 'locked' : (mode === 'write' ? 'active' : '')}`;
  
  document.getElementById('blockArea').style.display = mode === 'block' ? 'block' : 'none';
  document.getElementById('writeArea').style.display = mode === 'write' ? 'block' : 'none';
  document.getElementById('phaseTitle').textContent = mode === 'block' ? '2. Construcción por Filas (Bloques)' : '2. Escritura Manual Libre';
  
  clearCurrentPhase();
  document.getElementById('feedback').style.display = 'none';
}

function loadLevel(lvl, btn) {
  currentLevel = lvl;
  if(btn) {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }
  loadRandomExercise();
}

function loadRandomExercise() {
  hintIndex = 0;
  const list = EXERCISE_BANK[currentLevel];
  currentExercise = list[Math.floor(Math.random() * list.length)];
  
  document.getElementById('text').textContent = currentExercise.text;
  
  let html = '<table class="data-table"><tr><th>Celda</th><th>Concepto</th><th>Valor</th></tr>';
  currentExercise.data.forEach(r => html += `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`);
  html += '</table>';
  document.getElementById('data').innerHTML = html;

  buildRowsUI(currentLevel);
  renderBank(currentExercise.blocks);
  clearCurrentPhase();
  document.getElementById('hint').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('resultDisplay').textContent = '—';
  startTimer();
}

function buildRowsUI(lvl) {
  const container = document.getElementById('builderRows');
  container.innerHTML = '';

  if (lvl === 3) {
    container.innerHTML = `
      <div class="builder-row">
        <div class="row-label">Fila 1: Nivel 1 SI</div>
        <div class="drop-zone-row" id="row1" ondrop="dropBlock(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
      </div>
      <div class="builder-row">
        <div class="row-label">Fila 2: SI Anidado</div>
        <div class="drop-zone-row" id="row2" ondrop="dropBlock(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="builder-row">
        <div class="row-label">1. Prueba Lógica</div>
        <div class="drop-zone-row" id="row1" ondrop="dropBlock(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
      </div>
      <div class="sep-row-container">
        <span style="font-size:11px; font-weight:bold; color:#f59e0b;">Separador:</span>
        <div class="drop-zone-row sep-box" id="sep1" ondrop="dropBlock(event)" ondragover="allowDrop(event)"></div>
      </div>
      <div class="builder-row">
        <div class="row-label">2. Valor Verdadero</div>
        <div class="drop-zone-row" id="row2" ondrop="dropBlock(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
      </div>
      <div class="sep-row-container">
        <span style="font-size:11px; font-weight:bold; color:#f59e0b;">Separador:</span>
        <div class="drop-zone-row sep-box" id="sep2" ondrop="dropBlock(event)" ondragover="allowDrop(event)"></div>
      </div>
      <div class="builder-row">
        <div class="row-label">3. Valor Falso</div>
        <div class="drop-zone-row" id="row3" ondrop="dropBlock(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
      </div>
    `;
  }
}

function renderBank(blocks) {
  const bank = document.getElementById('bank');
  bank.innerHTML = '';
  const shuffled = [...blocks].sort(() => Math.random() - 0.5);
  shuffled.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = `block ${b.type}`;
    el.draggable = true;
    el.id = 'blk_' + i;
    el.textContent = b.text;
    el.ondragstart = e => e.dataTransfer.setData('text/plain', e.target.id);
    bank.appendChild(el);
  });
}

function allowDrop(e) {
  e.preventDefault();
  const zone = e.target.closest('.drop-zone-row');
  if(zone) zone.classList.add('drag-over');
}

function dragLeave(e) {
  const zone = e.target.closest('.drop-zone-row');
  if(zone) zone.classList.remove('drag-over');
}

function dropBlock(e) {
  e.preventDefault();
  const zone = e.target.closest('.drop-zone-row');
  if(zone) zone.classList.remove('drag-over');

  const id = e.dataTransfer.getData('text/plain');
  const el = document.getElementById(id);
  if (!el || !zone) return;

  zone.appendChild(el);
  updateFormulaFromRows();
}

function dropToBank(e) {
  e.preventDefault();
  const id = e.dataTransfer.getData('text/plain');
  const el = document.getElementById(id);
  if (!el) return;
  document.getElementById('bank').appendChild(el);
  updateFormulaFromRows();
}

function updateFormulaFromRows() {
  if (activeMode !== 'block') return;
  
  let fullFormula = '';
  if (currentLevel === 3) {
    const r1 = Array.from(document.getElementById('row1').children).map(c => c.textContent).join('');
    const r2 = Array.from(document.getElementById('row2').children).map(c => c.textContent).join('');
    fullFormula = r1 + r2;
  } else {
    const r1 = Array.from(document.getElementById('row1').children).map(c => c.textContent).join('');
    const s1 = document.getElementById('sep1') ? document.getElementById('sep1').textContent : '';
    const r2 = Array.from(document.getElementById('row2').children).map(c => c.textContent).join('');
    const s2 = document.getElementById('sep2') ? document.getElementById('sep2').textContent : '';
    const r3 = Array.from(document.getElementById('row3').children).map(c => c.textContent).join('');
    fullFormula = r1 + s1 + r2 + s2 + r3;
  }
  
  document.getElementById('formula').textContent = fullFormula || '=SI(...)';
}

function updateFormulaFromText() {
  const inputVal = document.getElementById('manualFormula').value;
  document.getElementById('formula').textContent = inputVal || '=SI(...)';
}

function clearCurrentPhase() {
  if (activeMode === 'block') {
    const bank = document.getElementById('bank');
    document.querySelectorAll('.drop-zone-row').forEach(zone => {
      Array.from(zone.children).forEach(child => bank.appendChild(child));
    });
    updateFormulaFromRows();
  } else {
    document.getElementById('manualFormula').value = '';
    updateFormulaFromText();
  }
}

function showHint() {
  if (!currentExercise || !currentExercise.hints) return;
  const hintBox = document.getElementById('hint');
  hintBox.style.display = 'block';
  hintBox.textContent = `💡 Pista ${hintIndex + 1}: ${currentExercise.hints[hintIndex % currentExercise.hints.length]}`;
  hintIndex++;
}

function checkCurrentPhase() {
  const currentFormula = document.getElementById('formula').textContent.replace(/\s+/g, '');
  const expectedFormula = currentExercise.expected.replace(/\s+/g, '');
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';

  if (currentFormula === expectedFormula) {
    fb.className = 'feedback ok';
    fb.textContent = '🎉 ¡Correcto! Has construido la fórmula de manera perfecta.';
    
    // Calcular resultado en pantalla
    const res = currentExercise.eval(currentExercise.data);
    document.getElementById('resultDisplay').textContent = res;
    
    // Puntos
    points += 100;
    document.getElementById('points').textContent = points;
    
    if (activeMode === 'block') {
      solvedBlocks.add(currentLevel);
      document.getElementById('blockProg').textContent = `${solvedBlocks.size}/4`;
    } else {
      solvedWrites.add(currentLevel);
      document.getElementById('writeProg').textContent = `${solvedWrites.size}/4`;
    }
    
    updateProgressAndBadges();
    
    // Enviar acierto a Google Sheets
    enviarDatosAGoogleSheets("Acierto", `Nivel ${currentLevel} (${activeMode}) completado`);

    if (solvedBlocks.size === 4 && activeMode === 'block') {
      showOverlay('🏆 ¡Fase de Bloques Completada!', 'Has desbloqueado la Fase 2: Modo Escritura Manual.', '👑');
      document.getElementById('btnModeWrite').classList.remove('locked');
    }
  } else {
    fb.className = 'feedback err';
    fb.textContent = '❌ Revisa la estructura. Asegúrate de que los bloques y separadores estén en el orden correcto.';
    
    // Enviar fallo a Google Sheets
    enviarDatosAGoogleSheets("Error", `Fallo en Nivel ${currentLevel} (${activeMode}). Intento: ${currentFormula}`);
  }
}

function updateProgressAndBadges() {
  const totalSolved = solvedBlocks.size + solvedWrites.size;
  const pct = Math.round((totalSolved / 8) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `Progreso del curso: ${pct}%`;

  if (totalSolved >= 1) document.getElementById('badge1').classList.add('unlocked');
  if (solvedBlocks.size >= 4) document.getElementById('badge2').classList.add('unlocked');
  if (solvedWrites.size >= 4) document.getElementById('badge3').classList.add('unlocked');
  if (totalSolved === 8) {
    document.getElementById('badge4').classList.add('unlocked');
    stars = 5;
    document.getElementById('stars').textContent = '5 ⭐';
  }
}

function showOverlay(title, msg, icon) {
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent = msg;
  document.getElementById('overlayIcon').textContent = icon || '🎉';
  document.getElementById('overlay').style.display = 'flex';
}

function closeOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function resetAll() {
  points = 0;
  stars = 0;
  solvedBlocks.clear();
  solvedWrites.clear();
  document.getElementById('points').textContent = '0';
  document.getElementById('stars').textContent = '0 ⭐';
  document.getElementById('blockProg').textContent = '0/4';
  document.getElementById('writeProg').textContent = '0/4';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = 'Progreso del curso: 0%';
  document.querySelectorAll('.badge').forEach(b => b.classList.remove('unlocked'));
  switchMode('block');
  loadLevel(1, document.querySelectorAll('.level-btn')[0]);
}

// FUNCIÓN PARA COMUNICAR CON GOOGLE APPS SCRIPT
function enviarDatosAGoogleSheets(accion, detalle) {
  if (!GOOGLE_SCRIPT_URL) return;

  // Construir los datos como parámetros de URL
  const params = new URLSearchParams({
    estudiante: studentName || "Anónimo",
    puntos: points,
    estrellas: stars,
    tiempo: document.getElementById('timer') ? document.getElementById('timer').textContent : "00:00",
    nivel: currentLevel,
    modo: activeMode,
    accion: accion || "Registro",
    detalle: detalle || "",
    fecha: new Date().toLocaleString('es-ES')
  });

  // Enviar mediante petición GET silenciosa (sin bloquear el juego)
  fetch(`${GOOGLE_SCRIPT_URL}?${params.toString()}`, {
    method: 'GET',
    mode: 'no-cors'
  })
  .then(() => console.log("Datos registrados con éxito en Sheets."))
  .catch(err => console.error("Error al enviar datos:", err));
}

    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(() => console.log("Datos enviados correctamente a Google Sheets."))
